name: build-ff

on:
  workflow_dispatch:

jobs:
  build:
    name: Build arm64 release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # 3.35.2 = 3.35 系列最后稳定版. media_kit >=1.3.0 的新 embedding
          # (onSurfaceDestroyed) 要求 Flutter >=3.35; AGP 8.11.1 / Gradle 8.13 /
          # Kotlin 2.2.20 正是 Flutter 3.35 的官方配套, 无需其他改动.
          flutter-version: "3.35.2"
          channel: stable
          cache: true