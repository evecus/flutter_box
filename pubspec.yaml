name: novabox_flutter
description: NovaBox - Flutter + Kotlin hybrid movie app.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # 锁死精确版本: 1.3.x 系列要求 Flutter 3.35+ 的新 embedding (onSurfaceDestroyed)
  media_kit: 1.1.11
  media_kit_video: 1.2.5
  media_kit_libs_android_video: 1.3.7
  # 弹幕: CustomPainter 直绘, 无 BuildContext 依赖, 选项可热更新
  canvas_danmaku: ^0.3.3
  shared_preferences: ^2.2.2
  path_provider: ^2.1.4
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
