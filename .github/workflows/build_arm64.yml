name: build-arm64

on:
  workflow_dispatch:

jobs:
  build:
    name: Build arm64 release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.4"
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Build arm64 APK
        env:
          NOVA_ABI_FILTERS: arm64-v8a
        run: |
          flutter build apk --release
          mv build/app/outputs/flutter-apk/app-release.apk NovaBox-arm64.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: bin
          prerelease: false
          files: NovaBox-arm64.apk
