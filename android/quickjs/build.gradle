plugins {
    id 'com.android.library'
}

android {
    namespace 'com.whl.quickjs.wrapper'
    compileSdk 35

    defaultConfig {
        minSdk 24
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        jniLibs {
            pickFirsts += ['lib/**/*.so']
        }
    }
}

dependencies {}
