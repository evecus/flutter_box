plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.novabox.flutter"
    compileSdk = 35

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId = "com.novabox.flutter"
        minSdk = 24
        targetSdk = 35
        versionCode = 1
        versionName = "1.0.0"
        // ABI 列表: 本机默认双架构; CI 通过 NOVA_ABI_FILTERS=arm64-v8a 覆盖为仅 arm64
        def abiSetting = System.getenv('NOVA_ABI_FILTERS') ?: "armeabi-v7a,arm64-v8a"
        ndk {
            abiFilters abiSetting.split(',').collect { it.trim() } as String[]
        }
    }

    buildTypes {
        release {
            minifyEnabled = false
            shrinkResources = false
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    implementation project(":crawler")
    implementation project(":quickjs")
}
